<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nuevo Proyecto</title>
    <style>
        body  { font-family: Arial, sans-serif; background: #1a1a2e;
                color: #e0e0e0; display: flex; justify-content: center;
                margin-top: 60px; }
        .caja { background: #16213e; padding: 40px; border-radius: 12px;
                border: 1px solid #4a90d9; width: 380px; box-sizing: border-box; }
        h1    { color: #f0c040; text-align: center; margin-bottom: 24px; font-size: 1.5em; }
        label { display: block; margin-bottom: 4px; color: #aaa; font-size: .9em; }
        input, textarea { width: 100%; padding: 10px; margin-bottom: 16px;
                background: #0f3460; border: 1px solid #4a90d9;
                border-radius: 6px; color: #fff; box-sizing: border-box; font-family: inherit; }
        button { width: 100%; padding: 12px; background: #4a90d9;
                 border: none; border-radius: 6px; color: white;
                 font-size: 1em; cursor: pointer; }
        button:hover { background: #357abd; }
        a     { display: block; text-align: center; margin-top: 16px;
                color: #4a90d9; text-decoration: none; font-size: .9em; }
    </style>
</head>
<body>
    <div class="caja">
        <h1>📂 Nuevo Proyecto</h1>
        <form th:action="@{/proyectos/guardar}" th:object="${proyecto}" method="post">
            <label>Nombre del Proyecto</label>
            <input type="text" th:field="*{nombre}" placeholder="Ej. Rediseño Web corporativo" required />

            <label>Descripción</label>
            <textarea th:field="*{descripcion}" placeholder="Breve descripción de los objetivos..." rows="3"></textarea>

            <button type="submit">Guardar Proyecto</button>
        </form>
        <a href="/proyectos">← Volver a Proyectos</a>
    </div>
</body>
</html>
